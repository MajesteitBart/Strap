name: OpenWiki Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.5.1

      - name: Check provider configuration
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Set the OPENROUTER_API_KEY repository secret for OpenWiki."
            exit 1
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Run OpenWiki
        timeout-minutes: 40
        run: |
          openwiki code --update --print &
          wiki_pid=$!
          trap 'kill "$wiki_pid" 2>/dev/null || true' EXIT
          while kill -0 "$wiki_pid" 2>/dev/null; do
            sleep 30
            echo "OpenWiki generation is running; current changed wiki paths:"
            git status --short -- openwiki
          done
          wait "$wiki_pid"
        env:
          OPENWIKI_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # The project account has no paid balance; never fall back to a paid route.
          OPENWIKI_MODEL_ID: cohere/north-mini-code:free
          OPENWIKI_OPENROUTER_MAX_TOKENS: "16384"
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Preserve repository instructions and executable configuration
        run: |
          git restore -- AGENTS.md CLAUDE.md .github/workflows/openwiki-update.yml
          rm -f -- openwiki/.run.json

      - name: Classify generated documentation changes
        run: node --experimental-strip-types scripts/check-strap-rebrand.mts --update-generated-wiki

      - name: Create OpenWiki update pull request
        if: github.ref == 'refs/heads/main'
        id: wiki_pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          base: main
          add-paths: |
            openwiki
            scripts/strap-rebrand-allowlist.json
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            This PR was generated by the scheduled OpenWiki workflow.
            Generated-page brand classifications are included for review; source classifications are unchanged.

      - name: Verify the generated pull request
        if: steps.wiki_pr.outputs.pull-request-operation == 'created' || steps.wiki_pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run verify.yml --ref openwiki/update
        env:
          GH_TOKEN: ${{ github.token }}
