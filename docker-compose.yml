name: strap-postgres

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: strap
      POSTGRES_PASSWORD: strap-local-only
      POSTGRES_DB: strap
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - strap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strap -d strap"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  strap-postgres:
